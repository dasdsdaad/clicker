<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Clicker Game</title>
    <style>
        body { font-family: 'Arial', sans-serif; text-align: center; background-color: #f0f2f5; }
        .container { max-width: 600px; margin: 50px auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        #score { font-size: 3em; font-weight: bold; color: #2ecc71; margin: 20px 0; }
        .click-btn { padding: 20px 40px; font-size: 1.5em; cursor: pointer; background-color: #3498db; color: white; border: none; border-radius: 10px; transition: background 0.2s; }
        .click-btn:hover { background-color: #2980b9; }
        .upgrade-btn { margin: 10px; padding: 10px 20px; cursor: pointer; background-color: #e67e22; color: white; border: none; border-radius: 5px; }
        .upgrade-btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .stats { margin-top: 20px; font-size: 0.9em; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h1>Mega Clicker</h1>
    <div id="score">0</div>
    <button class="click-btn" onclick="clickMain()">CLICK ME</button>
    
    <div class="upgrades">
        <h3>Upgrades</h3>
        <button class="upgrade-btn" id="upgrade1" onclick="buyUpgrade('cursor')">Better Clicks (Cost: 10)</button>
        <button class="upgrade-btn" id="upgrade2" onclick="buyUpgrade('auto')">Auto Clicker (Cost: 50)</button>
    </div>

    <div class="stats">
        <p>Points per click: <span id="ppc">1</span></p>
        <p>Points per second: <span id="pps">0</span></p>
    </div>

    <button onclick="resetGame()" style="margin-top: 30px; color: red;">Reset Game</button>
</div>

<script>
    // Game State
    let gameData = {
        score: 0,
        ppc: 1, // points per click
        pps: 0, // points per second
        cursorCost: 10,
        autoCost: 50
    };

    // Load game data from local storage
    if (localStorage.getItem("clickerSave")) {
        gameData = JSON.parse(localStorage.getItem("clickerSave"));
        updateDisplay();
    }

    // Main Click Function
    function clickMain() {
        gameData.score += gameData.ppc;
        updateDisplay();
    }

    // Purchase Upgrades
    function buyUpgrade(type) {
        if (type === 'cursor' && gameData.score >= gameData.cursorCost) {
            gameData.score -= gameData.cursorCost;
            gameData.ppc += 1;
            gameData.cursorCost = Math.round(gameData.cursorCost * 1.5);
            document.getElementById('upgrade1').innerText = `Better Clicks (Cost: ${gameData.cursorCost})`;
        } else if (type === 'auto' && gameData.score >= gameData.autoCost) {
            gameData.score -= gameData.autoCost;
            gameData.pps += 1;
            gameData.autoCost = Math.round(gameData.autoCost * 1.8);
            document.getElementById('upgrade2').innerText = `Auto Clicker (Cost: ${gameData.autoCost})`;
        }
        updateDisplay();
        saveGame();
    }

    // Update the HTML
    function updateDisplay() {
        document.getElementById('score').innerText = Math.floor(gameData.score);
        document.getElementById('ppc').innerText = gameData.ppc;
        document.getElementById('pps').innerText = gameData.pps;
    }

    // Save Game
    function saveGame() {
        localStorage.setItem("clickerSave", JSON.stringify(gameData));
    }

    // Auto-save every 5 seconds
    setInterval(saveGame, 5000);

    // Auto-clicker mechanic
    setInterval(function() {
        gameData.score += gameData.pps;
        updateDisplay();
    }, 1000);

    // Reset Game
    function resetGame() {
        localStorage.removeItem("clickerSave");
        location.reload();
    }
</script>

</body>
</html>
